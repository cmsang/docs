autoinstall:
  version: 1
  refresh-installer:
   update: true
  updates: security
  identity:
    hostname: ubuntu24
    username: shk
    password: "$5$OXc7m7YTvUkQtpfg$rOTYGgw/6aytPZQ.ky1PAY83XEH6D0gy7ub6x3YouN."
  locale: en_US
  timezone: "Asia/Ho_Chi_Minh"
  ssh:
    install-server: true
  packages:
    - qemu-guest-agent
    - curl
    - net-tools
  snaps:
    - name: code
      classic: true

  late-commands:
    - sleep 180
    - curtin in-target -- sudo apt remove --purge libreoffice*
    - curtin in-target -- sudo apt update -y
    - curtin in-target -- sudo apt upgrade -y
    - curtin in-target -- gsettings set org.gnome.desktop.interface enable-animations false
    - curtin in-target -- gsettings set org.gnome.desktop.session idle-delay 0
    - curtin in-target -- gsettings set org.gnome.nautilus.preferences show-hidden-files true
    - curtin in-target -- gsettings set org.gnome.shell favorite-apps ['org.gnome.Nautilus.desktop', 'gnome-terminal.desktop']
    - curtin in-target -- gsettings set org.gnome.shell.extensions.ding show-home false
    - curtin in-target -- gsettings set org.gtk.gtk4.Settings.FileChooser show-hidden true
    - curtin in-target -- sudo apt -y autoremove --purge
    - curtin in-target -- sudo apt -y clean
    - curtin in-target -- sudo apt -y autoclean
    - sudo sync
